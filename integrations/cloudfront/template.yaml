AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Template for cheq-rti-integration-cloudfront
Parameters:
  TrustedIPHeader:
    Description: Trusted IP Header
    Default: ''
    Type: String
  ExistingRoleArn:
    Description: ARN of an existing IAM role to use for the Lambda. If empty, a new role will be created.
    Default: ''
    Type: String
Conditions:
  TrustedIPHeaderIncluded: !Not
    - !Equals
      - !Ref TrustedIPHeader
      - ''
  CreateRole: !Equals
    - !Ref ExistingRoleArn
    - ''
Outputs:
  OriginRequestVersionARN:
    Description: Origin Request lambda version ARN. Use with origin-request CloudFront event trigger.
    Value: !Ref OriginRequest.Version
  ViewerRequestVersionARN:
    Description: Viewer Request lambda version ARN. Use with viewer-request CloudFront event trigger.
    Value: !Ref ViewerRequest.Version
  OriginRequestPolicy:
    Description: Default. All viewer headers (host and x-cheq-rti-result included) plus the tls, ja3 and ja4 CloudFront headers
    Value: !Sub "${AWS::StackName}-origin-request-policy"
  OriginRequestPolicyAllExceptHost:
    Description: All viewer headers except host, for origins that need their own host (API Gateway, Lambda function URLs, S3)
    Value: !Sub "${AWS::StackName}-origin-request-policy-all-except-host"
  OriginRequestPolicyNoHost:
    Description: Includes RTI, ja3/ja4 fingerprint and tls headers, no host header
    Value: !Sub "${AWS::StackName}-origin-request-policy-no-host"
  OriginRequestPolicyNoHostTrustedIP:
    Condition: TrustedIPHeaderIncluded
    Description: Includes RTI, ja3/ja4 fingerprint, tls and trusted ip headers, no host header
    Value: !Sub "${AWS::StackName}-origin-request-policy-no-host-trusted-ip"
  OriginRequestPolicyTrustedIP:
    Condition: TrustedIPHeaderIncluded
    Description: Includes RTI, ja3/ja4 fingerprint, tls, host and trusted ip headers
    Value: !Sub "${AWS::StackName}-origin-request-policy-trusted-ip"
Resources:
  LambdaRole:
    Type: AWS::IAM::Role
    Condition: CreateRole
    Properties:
      RoleName: !Sub "${AWS::StackName}-role"
      Policies:
        - PolicyName: cloudwatch-logging
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - arn:aws:logs:*:*:*
      AssumeRolePolicyDocument:
        Statement:
          - Action:
              - sts:AssumeRole
            Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
                - edgelambda.amazonaws.com
        Version: 2012-10-17
  OriginRequest:
    Type: AWS::Serverless::Function
    #DeletionPolicy: Retain  # Consider whether to retain or delete the Lambda function on stack deletion. Retaining can prevent accidental loss of the function and its versions.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-origin-request"
      AutoPublishAlias: live
      CodeUri: src/
      Handler: origin-request.handle
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Timeout: 30
      MemorySize: 128
      Role: !If [CreateRole, !GetAtt LambdaRole.Arn, !Ref ExistingRoleArn]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true # Disabled for local debugging (set to false) - set to true for production
        Target: "es2020"
        Sourcemap: false # Set to true for local debugging only. Must be false for Lambda@Edge deployment — sourcemaps significantly increase bundle size and Lambda@Edge has a strict 1 MB package size limit.
        EntryPoints:
          - origin-request.ts
  # Solution B: Viewer-Request Lambda
  # Attach to the viewer-request CloudFront event trigger.
  # Gets ALL viewer headers automatically — no origin request policy needed for Lambda to read headers.
  # Runs on every request before cache lookup. Hard timeout: 5 seconds.
  ViewerRequest:
    Type: AWS::Serverless::Function
    #DeletionPolicy: Retain  # Consider whether to retain or delete the Lambda function on stack deletion. Retaining can prevent accidental loss of the function and its versions.
    Properties:
      FunctionName: !Sub "${AWS::StackName}-viewer-request"
      AutoPublishAlias: live
      CodeUri: src/
      Handler: viewer-request.handle
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Timeout: 5
      MemorySize: 128
      Role: !If [CreateRole, !GetAtt LambdaRole.Arn, !Ref ExistingRoleArn]
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: true
        Target: "es2020"
        Sourcemap: false
        EntryPoints:
          - viewer-request.ts
  # The default. Forwards ALL viewer headers, so nothing has to be picked: the origin gets x-cheq-rti-result (the
  # verdict our Lambda adds), true-client-ip, x-forwarded-for, a trusted IP header and the site's own headers.
  # Why not a header list: a list holds at most 10 headers (AWS quota) and the old list was already full, so every
  # new header meant dropping one that some customer needs. Here the limit only counts the CloudFront headers below.
  # Same approach as AWS's managed AllViewerAndCloudFrontHeaders-2022-06 policy (all viewer headers), but with only the
  # tls, ja3 and ja4 CloudFront headers (AWS's has every CloudFront header up to June 2022, so no ja4). It does not change caching
  # (the cache key comes from the cache policy). For origins that break on the viewer's host, use
  # OriginRequestPolicyAllExceptHost.
  # TODO: confirm on stage that x-cheq-rti-result reaches the origin with this policy (INCQ-10263).
  OriginRequestPolicy:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-origin-request-policy"
        Comment: All viewer headers plus the tls, ja3 and ja4 CloudFront headers
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allViewerAndWhitelistCloudFront
          Headers:
            # Added by CloudFront, only when listed here. On origin-request the Lambda sends them to RTI.
            - cloudfront-viewer-tls
            - cloudfront-viewer-ja3-fingerprint
            - cloudfront-viewer-ja4-fingerprint
  # All viewer headers except host, for origins that expect their own domain in host (API Gateway, Lambda function
  # URLs, S3); CloudFront then sends the origin's domain as host. Like AWS's managed AllViewerExceptHostHeader.
  # This mode can't add CloudFront headers, so no tls/ja3/ja4: fine on viewer-request (the Lambda doesn't get them
  # there anyway). On origin-request, use OriginRequestPolicyNoHost if RTI should get them.
  OriginRequestPolicyAllExceptHost:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-origin-request-policy-all-except-host"
        Comment: All viewer headers except host
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allExcept
          Headers:
            - host
  # The policies below are header lists, for customers who want only named headers to reach the origin.
  # A list holds at most 10 headers (AWS quota, can be raised with a Service Quotas request) and only the listed
  # headers reach the origin: add x-cheq-rti-result if the origin needs the verdict.
  # Use when the origin must NOT receive the Host header (e.g. S3 REST endpoint, origins that use
  # their own domain). Omitting host prevents CloudFront from sending the viewer's hostname to
  # the origin, which would cause request failures on origins that don't recognize it.
  OriginRequestPolicyNoHost:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-origin-request-policy-no-host"
        Comment: Includes RTI, ja3/ja4 fingerprint and tls headers, no host header
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - cloudfront-viewer-tls
            - cloudfront-viewer-ja3-fingerprint
            - cloudfront-viewer-ja4-fingerprint
            - accept
            - accept-language
            - referer
            - user-agent
            - x-forwarded-for
            - true-client-ip
  # Same as NoHost but also forwards the custom header specified by the TrustedIPHeader parameter.
  # Only created when TrustedIPHeader is provided. The exact use case for TrustedIPHeader is unclear — carried over from the old repo without documentation.
  OriginRequestPolicyNoHostTrustedIP:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: TrustedIPHeaderIncluded
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-origin-request-policy-no-host-trusted-ip"
        Comment: Includes RTI, ja3/ja4 fingerprint, tls and trusted ip headers, no host header
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - cloudfront-viewer-tls
            - cloudfront-viewer-ja3-fingerprint
            - cloudfront-viewer-ja4-fingerprint
            - accept
            - accept-language
            - referer
            - user-agent
            - !Ref TrustedIPHeader
            - x-forwarded-for
            - true-client-ip
  # Note: 11 headers, over the default quota of 10, so creating it fails unless the quota was raised.
  # Header list with host, plus the custom header named by the TrustedIPHeader parameter.
  # Only created when TrustedIPHeader is provided. The exact use case for TrustedIPHeader is unclear — carried over from the old repo without documentation.
  OriginRequestPolicyTrustedIP:
    Type: AWS::CloudFront::OriginRequestPolicy
    Condition: TrustedIPHeaderIncluded
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-origin-request-policy-trusted-ip"
        Comment: Includes RTI, ja3/ja4 fingerprint, tls, host and trusted ip headers
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: whitelist
          Headers:
            - cloudfront-viewer-tls
            - cloudfront-viewer-ja3-fingerprint
            - cloudfront-viewer-ja4-fingerprint
            - accept
            - accept-language
            - host
            - referer
            - user-agent
            - !Ref TrustedIPHeader
            - x-forwarded-for
            - true-client-ip
  # The default policy plus CloudFront's geo and device headers (country, city, mobile/tablet/TV, header order and
  # count). Use it when RTI or the origin should get those too. Like the default, it forwards the viewer's host.
  OriginRequestPolicyAllHeadersAllowed:
    Type: AWS::CloudFront::OriginRequestPolicy
    Properties:
      OriginRequestPolicyConfig:
        Name: !Sub "${AWS::StackName}-origin-request-policy-all-headers-allowed"
        Comment: Includes RTI, ja3/ja4 fingerprint, tls headers, host and trusted ip headers
        QueryStringsConfig:
          QueryStringBehavior: all
        CookiesConfig:
          CookieBehavior: all
        HeadersConfig:
          HeaderBehavior: allViewerAndWhitelistCloudFront
          Headers:
          - cloudfront-viewer-tls
          - cloudfront-viewer-ja3-fingerprint
          - cloudfront-viewer-ja4-fingerprint
          - cloudfront-viewer-country
          - cloudfront-viewer-city
          - cloudfront-is-mobile-viewer
          - cloudfront-is-tablet-viewer
          - cloudfront-is-smarttv-viewer
          - CloudFront-Viewer-Header-Order
          - CloudFront-Viewer-Header-Count